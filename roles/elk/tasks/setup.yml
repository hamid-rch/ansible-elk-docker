- name: Ensure required directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ elk_compose_dir }}"
    - "{{ elk_compose_dir }}/kibana/config"
    - "{{ elk_compose_dir }}/logstash/pipeline"

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ compose_file }}"
    mode: '0644'